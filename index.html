<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Collage Studio Pro</title>
    <style>
        :root { 
            --ios-blue: #0A84FF; 
            --glass-bg: rgba(255, 255, 255, 0.08); 
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #FFFFFF;
            --text-sub: #8E8E93;
        }
        
        /* Universal reset and iOS touch overrides */
        * { 
            box-sizing: border-box; margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none; user-select: none;
        }

        /* Deep Sapphire Geometric Background */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; 
            background: radial-gradient(circle at top right, #002250 0%, #000814 60%, #000000 100%);
            color: var(--text-main); 
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }

        /* Abstract Background Elements for Depth */
        .bg-shape {
            position: absolute; border-radius: 50%; filter: blur(80px); z-index: 0; pointer-events: none;
        }
        .shape-1 { top: -10%; left: -10%; width: 300px; height: 300px; background: rgba(10, 132, 255, 0.15); }
        .shape-2 { bottom: 10%; right: -20%; width: 400px; height: 400px; background: rgba(0, 80, 200, 0.1); }

        .view { 
            display: none; height: 100%; width: 100%; flex-direction: column; 
            position: absolute; top: 0; left: 0; z-index: 1; 
        }
        .view.active { display: flex; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        /* Frosted Glass Utility Class */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
        }

        /* 1. HOME SCREEN */
        #view-home { justify-content: center; align-items: center; }
        .home-card {
            padding: 50px 40px; border-radius: 32px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 85%; max-width: 350px;
        }
        .title { font-size: 28px; font-weight: 800; margin-bottom: 8px; letter-spacing: 0.5px; }
        .subtitle { color: var(--text-sub); font-size: 15px; margin-bottom: 40px; }
        .upload-circle-btn {
            background: var(--ios-blue); color: #fff; width: 120px; height: 120px; 
            border-radius: 50%; display: inline-flex; flex-direction: column; 
            justify-content: center; align-items: center; gap: 8px; font-weight: 700; font-size: 14px;
            box-shadow: 0 10px 30px rgba(10, 132, 255, 0.4); cursor: pointer; transition: transform 0.1s;
        }
        .upload-circle-btn:active { transform: scale(0.92); }
        .plus-icon { font-size: 32px; font-weight: 300; line-height: 1; }
        input[type="file"] { display: none; }

        /* 2. EDITOR SCREEN */
        .top-bar { 
            height: 65px; display: flex; justify-content: space-between; align-items: center; 
            padding: 0 20px; z-index: 10; border-bottom: none; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
        }
        .nav-btn { background: none; border: none; color: var(--ios-blue); font-size: 17px; font-weight: 600; cursor: pointer; }
        .nav-btn.cancel { color: #FF453A; font-weight: 400; }
        
        #workspace { flex-grow: 1; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        canvas { touch-action: none; box-shadow: 0 15px 50px rgba(0,0,0,0.8); cursor: pointer; }

        /* Smart Toolbar */
        .bottom-bar { 
            height: 110px; display: flex; justify-content: space-evenly; align-items: flex-start; 
            padding-top: 20px; border-top-left-radius: 30px; border-top-right-radius: 30px; border-bottom: none; border-left: none; border-right: none;
        }
        .tool-btn { 
            background: rgba(255,255,255,0.1); color: white; border: none; padding: 14px 10px; 
            border-radius: 16px; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; 
            align-items: center; gap: 6px; flex: 1; margin: 0 6px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer;
        }
        .tool-btn:active { background: rgba(255,255,255,0.2); }
        .tool-btn.danger { color: #FF453A; }
        
        #edit-controls { display: none; width: 100%; justify-content: space-evenly; padding: 0 10px; }
        #add-controls { display: flex; width: 100%; justify-content: center; padding: 0 20px; }
        .wide-btn {
            background: var(--ios-blue); color: white; padding: 16px; border-radius: 20px;
            width: 100%; text-align: center; font-weight: 700; font-size: 16px; display: block; cursor: pointer; border: none;
        }

        /* 3. SAVE SCREEN OVERLAY */
        #view-save { z-index: 100; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        .save-card { padding: 30px 20px; border-radius: 30px; width: 90%; max-width: 400px; }
        #final-image { 
            max-width: 100%; max-height: 55vh; border-radius: 12px; margin-bottom: 25px; 
            pointer-events: auto; -webkit-touch-callout: default; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .save-instruction { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
        .save-sub { color: var(--text-sub); font-size: 15px; margin-bottom: 30px; line-height: 1.5; }
        .close-save { 
            background: rgba(255,255,255,0.15); color: white; padding: 16px 40px; 
            border-radius: 30px; border: none; font-weight: 700; font-size: 16px; width: 100%; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div id="view-home" class="view active">
        <div class="home-card glass">
            <h1 class="title">Collage Studio</h1>
            <p class="subtitle">Pro editing on your iPhone</p>
            <label class="upload-circle-btn">
                <span class="plus-icon">+</span>
                Pick Photos
                <input type="file" id="main-upload" accept="image/*" multiple>
            </label>
        </div>
    </div>

    <div id="view-editor" class="view">
        <div class="top-bar glass">
            <button class="nav-btn cancel" onclick="location.reload()">Clear</button>
            <span style="font-weight:700; font-size:16px;">Editor</span>
            <button class="nav-btn" onclick="openSaveScreen()">Save</button>
        </div>
        
        <div id="workspace">
            <canvas id="canvas"></canvas>
        </div>
        
        <div class="bottom-bar glass">
            <div id="add-controls">
                <label class="wide-btn">
                    + Add More Photos
                    <input type="file" id="add-more-upload" accept="image/*" multiple hidden>
                </label>
            </div>
            <div id="edit-controls">
                <button class="tool-btn" onclick="moveLayer(1)"><span>⬆️</span> Front</button>
                <button class="tool-btn" onclick="moveLayer(-1)"><span>⬇️</span> Back</button>
                <button class="tool-btn danger" onclick="removeSelected()"><span>🗑️</span> Delete</button>
                <button class="tool-btn" onclick="deselect()" style="background:var(--ios-blue); border-color:var(--ios-blue);">Done</button>
            </div>
        </div>
    </div>

    <div id="view-save" class="view" style="background: rgba(0,5,15,0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);">
        <div class="save-card glass">
            <h2 class="save-instruction">Image Ready</h2>
            <p class="save-sub">Long-press the photo below<br>and select <strong>"Save to Photos"</strong>.</p>
            <img id="final-image" src="" alt="Final Output">
            <button class="close-save" onclick="closeSaveScreen()">Return to Editor</button>
        </div>
    </div>

<script>
    const views = { 
        home: document.getElementById('view-home'), 
        editor: document.getElementById('view-editor'), 
        save: document.getElementById('view-save') 
    };
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let images = [], activeIdx = -1, activeHandle = -1;
    let isDragging = false;
    let startX = 0, startY = 0, origX = 0, origY = 0, origW = 0, origH = 0;

    // --- FILE UPLOAD LOGIC ---
    document.getElementById('main-upload').addEventListener('change', handleUpload);
    document.getElementById('add-more-upload').addEventListener('change', handleUpload);

    function handleUpload(e) {
        if (!e.target.files.length) return;
        const files = Array.from(e.target.files);
        let loaded = 0;
        
        // Transition to editor
        if(views.home.classList.contains('active')) {
            switchView('editor');
            const rect = document.getElementById('workspace').getBoundingClientRect();
            canvas.width = rect.width; 
            canvas.height = rect.height;
        }

        files.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const size = Math.min(canvas.width, canvas.height) * 0.5;
                    const aspect = img.width / img.height;
                    let w = size, h = size;
                    if(aspect > 1) h = w / aspect; else w = h * aspect;
                    
                    const offset = (images.length * 15) % 60;
                    images.push({ 
                        img: img, 
                        x: (canvas.width - w) / 2 + offset, 
                        y: (canvas.height - h) / 2 + offset, 
                        w: w, h: h 
                    });
                    
                    loaded++;
                    if(loaded === files.length) { 
                        activeIdx = images.length - 1;
                        updateToolbar(); 
                        draw(); 
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
        e.target.value = '';
    }

    // --- 8-SIDED HANDLE MATH ---
    function getHandles(it) {
        const hw = it.w / 2, hh = it.h / 2;
        return [
            {x: it.x, y: it.y},               // Top-Left
            {x: it.x + hw, y: it.y},          // Top-Center
            {x: it.x + it.w, y: it.y},        // Top-Right
            {x: it.x + it.w, y: it.y + hh},   // Right-Center
            {x: it.x + it.w, y: it.y + it.h}, // Bottom-Right
            {x: it.x + hw, y: it.y + it.h},   // Bottom-Center
            {x: it.x, y: it.y + it.h},        // Bottom-Left
            {x: it.x, y: it.y + hh}           // Left-Center
        ];
    }

    // --- DRAWING ENGINE ---
    function draw(forExport = false) {
        ctx.fillStyle = '#000814';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        for (let i = 0; i < images.length; i++) {
            const it = images[i];
            ctx.drawImage(it.img, it.x, it.y, it.w, it.h);
            
            if (i === activeIdx && !forExport) {
                ctx.strokeStyle = 'rgba(10, 132, 255, 0.6)';
                ctx.lineWidth = 2;
                ctx.strokeRect(it.x, it.y, it.w, it.h);
                
                const handles = getHandles(it);
                handles.forEach((h, idx) => {
                    ctx.fillStyle = idx === activeHandle ? '#FF453A' : '#0A84FF';
                    ctx.fillRect(h.x - 6, h.y - 6, 12, 12);
                });
            }
        }
    }

    // --- CANVAS INTERACTIONS ---
    const rect = canvas.getBoundingClientRect();
    
    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('mousemove', moveDrag);
    canvas.addEventListener('mouseup', endDrag);
    canvas.addEventListener('mouseleave', endDrag);
    
    canvas.addEventListener('touchstart', startDrag);
    canvas.addEventListener('touchmove', moveDrag);
    canvas.addEventListener('touchend', endDrag);

    function getCanvasCoords(e) {
        const clientX = e.clientX !== undefined ? e.clientX : e.touches[0].clientX;
        const clientY = e.clientY !== undefined ? e.clientY : e.touches[0].clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function startDrag(e) {
        if (activeIdx === -1) return;
        const coords = getCanvasCoords(e);
        startX = coords.x;
        startY = coords.y;
        
        const it = images[activeIdx];
        const handles = getHandles(it);
        
        activeHandle = -1;
        for (let i = 0; i < handles.length; i++) {
            const dist = Math.sqrt(Math.pow(handles[i].x - startX, 2) + Math.pow(handles[i].y - startY, 2));
            if (dist < 15) {
                activeHandle = i;
                break;
            }
        }
        
        if (activeHandle === -1 && startX >= it.x && startX <= it.x + it.w && startY >= it.y && startY <= it.y + it.h) {
            activeHandle = -2; // Moving
        }
        
        if (activeHandle !== -1) {
            origX = it.x;
            origY = it.y;
            origW = it.w;
            origH = it.h;
            isDragging = true;
            e.preventDefault();
        } else {
            deselect();
        }
    }

    function moveDrag(e) {
        if (!isDragging || activeIdx === -1) return;
        const coords = getCanvasCoords(e);
        const dx = coords.x - startX;
        const dy = coords.y - startY;
        const it = images[activeIdx];
        
        if (activeHandle === -2) {
            it.x = origX + dx;
            it.y = origY + dy;
        } else if (activeHandle === 0) {
            it.x = origX + dx;
            it.y = origY + dy;
            it.w = origW - dx;
            it.h = origH - dy;
        } else if (activeHandle === 1) {
            it.y = origY + dy;
            it.h = origH - dy;
        } else if (activeHandle === 2) {
            it.y = origY + dy;
            it.w = origW + dx;
            it.h = origH - dy;
        } else if (activeHandle === 3) {
            it.w = origW + dx;
        } else if (activeHandle === 4) {
            it.w = origW + dx;
            it.h = origH + dy;
        } else if (activeHandle === 5) {
            it.h = origH + dy;
        } else if (activeHandle === 6) {
            it.x = origX + dx;
            it.w = origW - dx;
            it.h = origH + dy;
        } else if (activeHandle === 7) {
            it.x = origX + dx;
            it.w = origW - dx;
        }
        
        if (it.w < 30) it.w = 30;
        if (it.h < 30) it.h = 30;
        
        draw();
        e.preventDefault();
    }

    function endDrag(e) {
        isDragging = false;
    }

    // --- LAYER MANAGEMENT ---
    function moveLayer(direction) {
        if (activeIdx === -1) return;
        if (direction > 0 && activeIdx < images.length - 1) {
            [images[activeIdx], images[activeIdx + 1]] = [images[activeIdx + 1], images[activeIdx]];
            activeIdx++;
        } else if (direction < 0 && activeIdx > 0) {
            [images[activeIdx], images[activeIdx - 1]] = [images[activeIdx - 1], images[activeIdx]];
            activeIdx--;
        }
        draw();
    }

    function removeSelected() {
        if (activeIdx === -1) return;
        images.splice(activeIdx, 1);
        activeIdx = -1;
        activeHandle = -1;
        updateToolbar();
        draw();
    }

    function deselect() {
        activeIdx = -1;
        activeHandle = -1;
        updateToolbar();
        draw();
    }

    // --- UI MANAGEMENT ---
    function switchView(viewName) {
        Object.values(views).forEach(v => v.classList.remove('active'));
        views[viewName].classList.add('active');
    }

    function updateToolbar() {
        const editControls = document.getElementById('edit-controls');
        const addControls = document.getElementById('add-controls');
        
        if (activeIdx === -1) {
            editControls.style.display = 'none';
            addControls.style.display = 'flex';
        } else {
            editControls.style.display = 'flex';
            addControls.style.display = 'none';
        }
    }

    function openSaveScreen() {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        const tempCtx = tempCanvas.getContext('2d');
        
        tempCtx.fillStyle = '#000814';
        tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
        
        for (let i = 0; i < images.length; i++) {
            const it = images[i];
            tempCtx.drawImage(it.img, it.x, it.y, it.w, it.h);
        }
        
        document.getElementById('final-image').src = tempCanvas.toDataURL();
        switchView('save');
    }

    function closeSaveScreen() {
        switchView('editor');
        draw();
    }

    // Initialize
    window.addEventListener('resize', () => {
        if (views.editor.classList.contains('active')) {
            const rect = document.getElementById('workspace').getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            draw();
        }
    });
</script>
</body>
</html>
